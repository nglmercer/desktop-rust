name: Setup CI Environment
description: Set up Python, Node.js, optional ffmpeg, and install dependencies.

inputs:
  node-version:
    description: Node.js version to use.
    required: true
  arch:
    description: Target architecture for dependency installation.
    required: true
  install-ffmpeg:
    description: Whether to install ffmpeg on Windows.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install ffmpeg
      if: ${{ runner.os == 'Windows' && inputs.install-ffmpeg == 'true' }}
      shell: bash
      run: choco install ffmpeg --yes --no-progress

    - name: Prepare Rust compiler and target
      shell: bash
      env:
        DESKTOP_TARGET_ARCH: ${{ inputs.arch }}
      run: |
        rustup default stable
        case "$RUNNER_OS:$DESKTOP_TARGET_ARCH" in
          macOS:x64) target=x86_64-apple-darwin ;;
          macOS:arm64) target=aarch64-apple-darwin ;;
          Windows:x64) target=x86_64-pc-windows-msvc ;;
          Windows:arm64) target=aarch64-pc-windows-msvc ;;
          *) echo "Unsupported Rust target for $RUNNER_OS:$DESKTOP_TARGET_ARCH" >&2; exit 1 ;;
        esac
        rustup target add "$target"

    - name: Install pnpm
      shell: bash
      run: npm install --global pnpm@11.17.0

    - name: Install and build dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      env:
        npm_config_arch: ${{ inputs.arch }}
        TARGET_ARCH: ${{ inputs.arch }}
