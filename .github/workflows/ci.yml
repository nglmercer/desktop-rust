name: CI

on:
  push:
    branches:
      - development
  pull_request:
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        required: true
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:
      GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID:
      GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID:
      GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY:
      APPLE_APPLICATION_CERT:
      APPLE_APPLICATION_CERT_PASSWORD:

env:
  NODE_VERSION: 24.22.1
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT: ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            vendor/*/package-lock.json
      - name: Prepare Rust compiler
        run: rustup default stable
      - run: npm ci
      - run: npm run lint
      - run: npm run validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  test:
    name: Test ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-xlarge, windows-2022]
        arch: [x64, arm64]
        include:
          - os: macos-15-xlarge
            friendlyName: macOS
          - os: windows-2022
            friendlyName: Windows
    timeout-minutes: 60
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          npm ci
          npm run lint
          npm test
      - name: Prepare testing environment
        run: npm run test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: |
          (runner.os == 'Windows' && matrix.arch == 'x64') || (runner.os == 'macOS' && matrix.arch == 'arm64')
        run: npm run test:unit
      - name: Run script tests
        run: npm run test:script
        env:
          npm_config_arch: ${{ matrix.arch }}
