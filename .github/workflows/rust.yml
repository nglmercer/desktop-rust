name: Rust migration
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust/**'
      - 'app/webpack.common.ts'
      - 'app/src/models/**'
      - 'app/src/lib/git/interpret-trailers.ts'
      - 'app/src/lib/git/stash.ts'
      - 'app/src/lib/remove-remote-prefix.ts'
      - 'app/src/lib/helpers/repo-rules.ts'
      - 'app/src/lib/get-file-hash.ts'
      - 'app/src/web/**'
      - 'app/test/unit/web-*'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app/src/models/diff/diff-line.ts'
      - 'app/src/models/diff/raw-diff.ts'
      - 'app/src/ui/diff/image-diffs/**'
      - 'app/src/ui/lib/form.tsx'
      - 'app/src/ui/lib/row.tsx'
      - 'app/src/ui/lib/horizontal-rule.tsx'
      - 'app/src/ui/lib/highlight-text.tsx'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust/**'
      - 'app/webpack.common.ts'
      - 'app/src/models/**'
      - 'app/src/lib/git/interpret-trailers.ts'
      - 'app/src/lib/git/stash.ts'
      - 'app/src/lib/remove-remote-prefix.ts'
      - 'app/src/lib/helpers/repo-rules.ts'
      - 'app/src/lib/get-file-hash.ts'
      - 'app/src/web/**'
      - 'app/test/unit/web-*'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app/src/models/diff/diff-line.ts'
      - 'app/src/models/diff/raw-diff.ts'
      - 'app/src/ui/diff/image-diffs/**'
      - 'app/src/ui/lib/form.tsx'
      - 'app/src/ui/lib/row.tsx'
      - 'app/src/ui/lib/horizontal-rule.tsx'
      - 'app/src/ui/lib/highlight-text.tsx'
      - '.github/workflows/rust.yml'
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify submodules are present
        run: git submodule update --init --recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install the renderer and build its bundle
        # The renderer is the React app built by Vite. The root package.json
        # postinstall is the Electron-era npm installer, so it is not run here.
        # Vite must run before any Rust crate that embeds out/vite-dist.
        run: |
          npm install --global pnpm@11.17.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm vite:build
          test -f out/vite-dist/index.html
          test -f out/vite-dist/highlighter.js
      - name: Frontend web shims (Vitest via node --test)
        run: node --test app/test/unit/web-*.ts 2>&1 | head -n 100 || node script/test.mjs app/test/unit/web-child-process-test.ts app/test/unit/web-fs-range-test.ts app/test/unit/web-random-uuid-test.ts
      - name: Check Rust (headless workspace)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: Check Rust shell workspace compilation
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked
      - name: Verify installed Git LFS
        run: git lfs version
      - name: Check repository and GitHub services offline
        run: |
          python3 rust/tests/lifecycle.py
          python3 rust/tests/cancellation.py
          python3 rust/tests/signals.py
          python3 rust/tests/workflows.py
          python3 rust/tests/direct_git_cli.py
          python3 rust/tests/stashes.py
          python3 rust/tests/branch_rename.py
          python3 rust/tests/branch_create.py
          python3 rust/tests/branch_refs.py
          python3 rust/tests/branch_policy.py
          python3 rust/tests/repository_context.py
          python3 rust/tests/repository_accounts.py
          python3 rust/tests/publish_context.py
          python3 rust/tests/publish_preview.py
          python3 rust/tests/publish_receipts.py
          python3 rust/tests/publish_create.py
          python3 rust/tests/publish_ledger_visibility.py
          python3 rust/tests/publish_preview_cancel.py
          python3 rust/tests/publish_continue.py
          python3 rust/tests/publish_origin.py
          python3 rust/tests/git_credentials.py
          python3 rust/tests/upstream_setup.py
          python3 rust/tests/branch_name_rules.py
          python3 rust/tests/branch_delete.py
          python3 rust/tests/remote_delete.py
          python3 rust/tests/upstream_delete.py
          python3 rust/tests/checkout.py
          python3 rust/tests/checkout_native.py
          python3 rust/tests/native_smoke_launch.py
          python3 rust/tests/commit_review.py
          python3 rust/tests/diffs.py
          python3 rust/tests/discard.py
          python3 rust/tests/discard_advanced.py
          python3 rust/tests/discard_gc.py
          python3 rust/tests/lfs.py
          python3 rust/tests/lfs_diffs.py
          python3 rust/tests/lfs_operations.py
          python3 rust/tests/history_state.py
          python3 rust/tests/editor_conflicts.py
          python3 rust/tests/conflict_undo.py
          python3 rust/tests/management.py
          python3 rust/tests/repositories.py
          python3 rust/tests/github.py
          python3 rust/tests/github_cli.py
          python3 rust/tests/github_create.py
          python3 rust/tests/github_checkout_tracking.py

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libxdo-dev xvfb dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk at-spi2-core libgl1-mesa-dri mesa-utils libegl1-mesa libegl1 xauth
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Build renderer before shell embedding
        if: runner.os == 'Linux'
        run: |
          git submodule update --init --recursive
          npm install --global pnpm@11.17.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm vite:build
      - name: Compile native host (headless bridge)
        run: |
          cargo clippy -p desktop-native --features native --all-targets --locked -- -D warnings
          cargo test -p desktop-core -p desktop-native --features desktop-native/native --locked
          cargo build -p desktop-native --features native --locked
      - name: Compile desktop shell
        if: runner.os == 'Linux'
        run: cargo build --manifest-path rust/Cargo.toml -p desktop-app --locked
      - name: Exercise native webview on Linux
        if: runner.os == 'Linux'
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/desktop-native-global.gitconfig
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GDK_BACKEND: 'x11'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_SYNCHRONIZE: '1'
          NO_AT_BRIDGE: '1'
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$(dirname "$GIT_CONFIG_GLOBAL")"
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- timeout 60s rust/target/debug/desktop-native --empty --config "$RUNNER_TEMP/desktop-native-smoke/repositories.json" --smoke-test
      - name: Start the desktop application
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          NO_AT_BRIDGE: '1'
        run: python3 rust/tests/app_smoke.py
