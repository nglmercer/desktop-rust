name: Rust migration
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust/**'
      - 'app/src/**'
      - 'app/index.html'
      - 'app/styles/**'
      - '.test.env'
      - 'app/webpack.common.ts'
      - 'app/build-externals.ts'
      - 'app/src/models/**'
      - 'app/src/lib/git/interpret-trailers.ts'
      - 'app/src/lib/git/stash.ts'
      - 'app/src/lib/remove-remote-prefix.ts'
      - 'app/src/lib/helpers/repo-rules.ts'
      - 'app/src/lib/get-file-hash.ts'
      - 'app/src/web/**'
      - 'app/test/unit/web-*'
      - 'app/test/unit/**'
      - 'app/test/helpers/usage-data.ts'
      - 'app/test/vitest-setup.ts'
      - 'app/test/backend-transport-tsconfig.json'
      - 'script/test.mts'
      - 'script/generate-example-usage-data.mts'
      - 'script/highlighter-build.test.ts'
      - 'eslint-rules/**'
      - 'vendor/desktop-trampoline/**'
      - 'biome.json'
      - 'vitest.config.ts'
      - 'vitest-suites.json'
      - 'vite.config.ts'
      - 'vite.highlighter.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'app/src/models/diff/diff-line.ts'
      - 'app/src/models/diff/raw-diff.ts'
      - 'app/src/ui/diff/image-diffs/**'
      - 'app/src/ui/lib/form.tsx'
      - 'app/src/ui/lib/row.tsx'
      - 'app/src/ui/lib/horizontal-rule.tsx'
      - 'app/src/ui/lib/highlight-text.tsx'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust/**'
      - 'app/src/**'
      - 'app/index.html'
      - 'app/styles/**'
      - '.test.env'
      - 'app/webpack.common.ts'
      - 'app/build-externals.ts'
      - 'app/src/models/**'
      - 'app/src/lib/git/interpret-trailers.ts'
      - 'app/src/lib/git/stash.ts'
      - 'app/src/lib/remove-remote-prefix.ts'
      - 'app/src/lib/helpers/repo-rules.ts'
      - 'app/src/lib/get-file-hash.ts'
      - 'app/src/web/**'
      - 'app/test/unit/web-*'
      - 'app/test/unit/**'
      - 'app/test/helpers/usage-data.ts'
      - 'app/test/vitest-setup.ts'
      - 'app/test/backend-transport-tsconfig.json'
      - 'script/test.mts'
      - 'script/generate-example-usage-data.mts'
      - 'script/highlighter-build.test.ts'
      - 'eslint-rules/**'
      - 'vendor/desktop-trampoline/**'
      - 'biome.json'
      - 'vitest.config.ts'
      - 'vitest-suites.json'
      - 'vite.config.ts'
      - 'vite.highlighter.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'app/src/models/diff/diff-line.ts'
      - 'app/src/models/diff/raw-diff.ts'
      - 'app/src/ui/diff/image-diffs/**'
      - 'app/src/ui/lib/form.tsx'
      - 'app/src/ui/lib/row.tsx'
      - 'app/src/ui/lib/horizontal-rule.tsx'
      - 'app/src/ui/lib/highlight-text.tsx'
      - '.github/workflows/rust.yml'
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify submodules are present
        run: git submodule update --init --recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install the renderer and build its bundle
        # The renderer is the React app built by Vite. The root package.json
        # postinstall is the Electron-era npm installer, so it is not run here.
        # Vite must run before any Rust crate that embeds out/vite-dist.
        run: |
          npm install --global pnpm@11.17.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm vite:build
          test -f out/vite-dist/index.html
          test -f out/vite-dist/highlighter.js
      - name: Check migrated frontend tooling and tests
        run: |
          npm run lint:biome
          npm run check:eslint
          npm ci --prefix vendor/desktop-trampoline --no-audit --no-fund
          npm run lint --prefix vendor/desktop-trampoline
          npm test --prefix vendor/desktop-trampoline
          node node_modules/typescript/bin/tsc -p app/test/backend-transport-tsconfig.json
          node node_modules/typescript/bin/tsc -p rust/tests/tsconfig.json
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts
          npm ci --prefix rust/tests/branch-rules-oracle --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix rust/tests/branch-rules-oracle
          node --import tsx rust/tests/branch-rules-oracle/oracle.mts --check
          node --import tsx rust/tests/branch-rules-oracle/oracle.mts --check --current-re2js
          node --import tsx rust/tests/branch-rules-oracle/build-engine.mts --check
      - name: Check Rust (headless workspace)
        env:
          DESKTOP_TEST_REQUIRE_LFS: '1'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --exclude desktop-app --all-targets --locked -- -D warnings
          cargo test --workspace --exclude desktop-app --locked
          DESKTOP_TEST_REQUIRE_COPILOT_RUNTIME=1 cargo test -p desktop-core installed_runtime_responds_to_handshake_and_ping_when_present --locked
          cargo test -p desktop-native --test smoke_launch --locked
          cargo build --workspace --exclude desktop-app --locked
      - name: Exercise the frontend transport against the real bridge
        run: DESKTOP_TEST_BRIDGE=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts app/test/unit/backend-websocket-integration-test.ts rust/tests/github-adapter.test.ts
      - name: Exercise the installed GitHub CLI against a local HTTPS API
        run: DESKTOP_TEST_REAL_GH=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/github-cli.test.ts
      - name: Verify installed Git LFS
        run: git lfs version
      - name: Check repository and GitHub services offline
        run: |
          DESKTOP_TEST_BRANCH_RULES=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/branch-name-rules.test.ts
          DESKTOP_TEST_ACCOUNTS=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/repository-accounts.test.ts
          DESKTOP_TEST_PR_CREATE=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/github-create.test.ts
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/git-http-fixture.test.ts
          DESKTOP_TEST_GIT_CREDS=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/git-credentials.test.ts
          DESKTOP_TEST_GIT_CREDS=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/git-credential-policy.test.ts
          DESKTOP_TEST_GIT_CREDS=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/git-credential-checkout.test.ts
          DESKTOP_TEST_GIT_CREDS=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts rust/tests/github-checkout-tracking.test.ts
      - name: Exercise the opt-in embedded browser frontend
        run: |
          cargo test -p desktop-bridge --features embedded-ui --test lifecycle --locked
          cargo build -p desktop-cli --features embedded-ui --locked
          pnpm exec playwright install --with-deps --only-shell chromium
          DESKTOP_TEST_BROWSER_ENTRY=1 node node_modules/vitest/vitest.mjs run --config vitest.config.ts app/test/unit/backend-browser-entry-integration-test.ts

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libxdo-dev xvfb dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk at-spi2-core libgl1-mesa-dri mesa-utils libegl1-mesa libegl1 xauth
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Build renderer before shell embedding
        if: runner.os == 'Linux'
        run: |
          git submodule update --init --recursive
          npm install --global pnpm@11.17.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm vite:build
      - name: Compile native host (headless bridge)
        run: |
          cargo clippy -p desktop-native --features native --all-targets --locked -- -D warnings
          cargo test -p desktop-core -p desktop-native --features desktop-native/native --locked
          cargo build -p desktop-native --features native --locked
      - name: Check desktop shell
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p desktop-app --all-targets --locked -- -D warnings
          cargo test -p desktop-app --locked
          cargo build -p desktop-app --locked
      - name: Exercise native webview on Linux
        if: runner.os == 'Linux'
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/desktop-native-global.gitconfig
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GDK_BACKEND: 'x11'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_SYNCHRONIZE: '1'
          NO_AT_BRIDGE: '1'
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$(dirname "$GIT_CONFIG_GLOBAL")"
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- timeout 60s rust/target/debug/desktop-native --empty --config "$RUNNER_TEMP/desktop-native-smoke/repositories.json" --smoke-test
      - name: Start the desktop application
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          NO_AT_BRIDGE: '1'
        run: xvfb-run -a cargo test -p desktop-app --test app_smoke --locked -- --ignored
