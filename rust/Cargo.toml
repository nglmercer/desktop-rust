[workspace]
resolver = "2"
members = ["crates/desktop-core", "crates/desktop-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/desktop/desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
muda = "0.21"
rfd = "0.17"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
desktop-shell-core-legacy = { package = "desktop-shell-core-legacy", path = "crates/desktop-core" }
desktop_core = { package = "desktop-shell-core-legacy", path = "crates/desktop-core" }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
