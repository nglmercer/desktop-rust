[package]
name = "desktop-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
embedded-ui = ["dep:include_dir"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
desktop-core = { path = "../core" }
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
