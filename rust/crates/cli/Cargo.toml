[package]
name = "desktop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "desktop-rs"
path = "src/main.rs"

[features]
embedded-ui = ["desktop-bridge/embedded-ui"]
clone-prototype = ["desktop-core/clone-prototype"]
packaged-runtime = ["desktop-core/packaged-runtime"]

[[example]]
name = "selected_clone_prototype"
required-features = ["clone-prototype"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
desktop-core = { path = "../core" }
desktop-bridge = { path = "../bridge" }
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
base64.workspace = true
libc = "0.2"
sha2.workspace = true
futures-util = "0.3"
tokio-tungstenite = "0.29"
uuid.workspace = true
