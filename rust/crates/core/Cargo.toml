[package]
name = "desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
clone-prototype = []

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
sha1 = "0.10.7"
base64.workspace = true
url = "2.5"
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "bindgen"] }
