[package]
name = "desktop-app"
description = "GitHub Desktop application shell built directly on tao + wry (no Tauri, no Electron)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "github-desktop-rs"
path = "src/main.rs"

[dependencies]
desktop_core.workspace = true
desktop_backend = { package = "desktop-core", path = "../core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
http.workspace = true
tao.workspace = true
wry.workspace = true
muda.workspace = true
rfd.workspace = true
arboard.workspace = true
include_dir = "0.7"
uuid = { workspace = true, features = ["serde"] }
url = "2"

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
# Same version wry links; used for the Edit menu's editing commands.
webkit2gtk = "2.0"
